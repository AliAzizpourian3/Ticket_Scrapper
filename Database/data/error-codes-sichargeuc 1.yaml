  fanControlTimeout:
    errorCode: fanControlTimeout
    errorName: "120220"
    classification: Maintenance
    severity: Minor
    description: Setpoint sent to fans was not confirmed by FanControl (timeout configurable).
    potentialRootCause: ""
    potentialResolution: "There can be 3 reasons why this error can appear: The fan is broken and needs replacement. The AC circuit breaker for the fan has tripped, thus the fan has no supply voltage. The Fan Control Platform is broken.  To confirm what is the cause follow the steps below: Confirm that the circuit breaker for the fan is tripped. If so, reset it and confirm if the fan is operational. If the circuit breaker trips again, re-wire another fan to that circuit breaker to confirm that it is not damaged. If the circuit breaker still trips with another fan connected to it, check all the wiring between the fan and the circuit breaker. There might be an cable extension between the fan and the circuit breaker. If nothing is detected on the wiring replace the circuit-breaker. If the breaker does trip again, then the Fan needs replacement. If the circuit breaker is not tripped, go to step 2. If the circuit breaker is not tripped, change the connections on the Fan Control Platform of the fan that is not spinning, to an one that it is spinning. For instance, consider that the error is fan1NoSpin and Fan 2 is working. Re-wire the connections from Fan 2 to Fan 1 and from Fan 1 to Fan 2. Test the system: if the error displayed is fan2NoSpin, then the fan is broken. Otherwise, the board needs replacement."
