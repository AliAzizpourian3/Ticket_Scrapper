ErrorCodes:
  IllegalTransition:
    errorCode: IllegalTransition
    errorName: "100101"
    classification: Maintenance
    severity: Major
    description: Illegal transition of EVSEcore state. This means that the siucapp went from one state to another which was not designed to do
    potentialRootCause: ""
    potentialResolution: Using the siucapp logs, identify specific step in which the process failed. Investigate the possible root cause for that specific process.
  unexpectedError:
    errorCode: unexpectedError
    errorName: "220400"
    classification: Maintenance
    severity: Minor
    description: ""
    potentialRootCause: ""
    potentialResolution: ""
  outputEnabledTimeout:
    errorCode: outputEnabledTimeout
    errorName: "100201"
    classification: Maintenance
    severity: Major
    description: "Timeout for enabling charger output. The OutputEnable includes: close AC contactors close DC contactors turn ON power converter"
    potentialRootCause: ""
    potentialResolution: Using the siucapp logs, identify specific step in which the process failed. Investigate the possible root cause for that specific process.
  outputEnabledFail:
    errorCode: outputEnabledFail
    errorName: "100202"
    classification: Maintenance
    severity: Major
    description: Fail during the output enable (channel closed for example).
    potentialRootCause: ""
    potentialResolution: Using the siucapp logs, identify specific step in which the process failed. Investigate the possible root cause for that specific process.
  outputEnabledUnhandled:
    errorCode: outputEnabledUnhandled
    errorName: "100203"
    classification: Maintenance
    severity: Major
    description: Received an outputEnabled without any active command.
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  outputDisabledTimeout:
    errorCode: outputDisabledTimeout
    errorName: "100204"
    classification: Maintenance
    severity: Major
    description: "Timeout for disabling charger output. Like OutputEnable, it includes: turn OFF power converter wait for safe DC voltage and current (60V/2A) open DC contactors close AC contactors"
    potentialRootCause: ""
    potentialResolution: Using the siucapp logs, identify specific step in which the process failed. Investigate the possible root cause for that specific process.
  outputDisabledFail:
    errorCode: outputDisabledFail
    errorName: "100205"
    classification: Maintenance
    severity: Major
    description: Fail during the output disable (channel closed for example).
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  outputDisabledUnhandled:
    errorCode: outputDisabledUnhandled
    errorName: "100206"
    classification: Maintenance
    severity: Major
    description: Received an outputDisabled without any active command.
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  voltageSetpointTimeout:
    errorCode: voltageSetpointTimeout
    errorName: "100207"
    classification: Maintenance
    severity: Major
    description: Timeout for voltage setpoint. A certain target was requested to the Power Converter but there was no positive feedback from this request.
    potentialRootCause: ""
    potentialResolution: "Investigate the exact moment when this error occurs and if error is alone or triggered after other error. It can be caused by: Setpoint was not received by Power Converter CAN communication problem or any other existing Power Converter issue which was not correctly detected Something is preventing the Power Converter from reaching the setpoint check if error is associated with specific EV (may point towards EV related problems) check if error is persistent or an isolated event. Isolated events should be registered but can be ignored. check if charger is able to reach a setpoint without an EV connected check all DC line connections check for potential short circuits"
  voltageSetpointFail:
    errorCode: voltageSetpointFail
    errorName: "100208"
    classification: Maintenance
    severity: Major
    description: Fail during voltage setpoint (channel closed for example).
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  voltageSetpointUnhandled:
    errorCode: voltageSetpointUnhandled
    errorName: "100209"
    classification: Maintenance
    severity: Major
    description: Received an voltageSetpointCB without any active command.
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  currentSetpointTimeout:
    errorCode: currentSetpointTimeout
    errorName: "100210"
    classification: Maintenance
    severity: Major
    description: Timeout for current setpoint
    potentialRootCause: ""
    potentialResolution: "Investigate the exact moment when this error occurs and if error is alone or triggered after other error. It can be caused by: Setpoint was not received by Power Converter CAN communication problem or any other existing Power Converter issue which was not correctly detected Something is preventing the Power Converter from reaching the setpoint check if error is associated with specific EV (may point towards EV related problems) check if error is persistent or an isolated event. Isolated events should be registered but can be ignored. check if charger is able to reach a setpoint without an EV connected check all DC line connections check for potential short circuits"
  currentSetpointFail:
    errorCode: currentSetpointFail
    errorName: "100211"
    classification: Maintenance
    severity: Major
    description: Fail during current setpoint (channel closed for example).
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  currentSetpointUnhandled:
    errorCode: currentSetpointUnhandled
    errorName: "100212"
    classification: Maintenance
    severity: Major
    description: Received an currentSetpointCB without any active command.
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  bindedCheckFail:
    errorCode: bindedCheckFail
    errorName: "100213"
    classification: Maintenance
    severity: Major
    description: Not binded to any process.
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  assertVoltageLowerThanFail:
    errorCode: assertVoltageLowerThanFail
    errorName: "100214"
    classification: Maintenance
    severity: Major
    description: Voltage value at the output not low enough in the expected time. For now it is only being used on process of turning OFF (voltage lower than 10 V).
    potentialRootCause: ""
    potentialResolution: "Investigate the exact moment when this error occurs and if error is alone or triggered after other error. It can be caused by: If DSP is part of the solution (UC150), firmware version may not be the latest; check that the version is at least 2.0.7 Setpoint was not received by Power Converter CAN communication problem or any other existing Power Converter issue which was not correctly detected Something is preventing the Power Converter from reaching the setpoint check if error is associated with specific EV (may point towards EV related problems) check if error is persistent or an isolated event. Isolated events should be registered but can be ignored. check if charger is able to reach a setpoint without an EV connected check all DC line connections check for potential short circuits"
  assertVoltageHigherThanFail:
    errorCode: assertVoltageHigherThanFail
    errorName: "100215"
    classification: Maintenance
    severity: Major
    description: Voltage value at the output not high enough in the expected time. For now it is only being used on process of CableCheck (voltage higher than 475 V * 0.95).
    potentialRootCause: ""
    potentialResolution: "Investigate the exact moment when this error occurs and if error is alone or triggered after other error. It can be caused by: Setpoint was not received by Power Converter CAN communication problem or any other existing Power Converter issue which was not correctly detected Something is preventing the Power Converter from reaching the setpoint check if error is associated with specific EV (may point towards EV related problems) check if error is persistent or an isolated event. Isolated events should be registered but can be ignored. check if charger is able to reach a setpoint without an EV connected check all DC line connections check for potential short circuits"
  assertCurrentLowerThanFail:
    errorCode: assertCurrentLowerThanFail
    errorName: "100216"
    classification: Maintenance
    severity: Critical
    description: Current value at the output not low enough in the expected time. For now it is only being used on process of turning OFF (current lower than 2A).
    potentialRootCause: ""
    potentialResolution: "Investigate the exact moment when this error occurs and if error is alone or triggered after other error. It can be caused by: Setpoint was not received by Power Converter CAN communication problem or any other existing Power Converter issue which was not correctly detected Something is preventing the Power Converter from reaching the setpoint check if error is associated with specific EV (may point towards EV related problems) check if error is persistent or an isolated event. Isolated events should be registered but can be ignored. check if charger is able to reach a setpoint without an EV connected check all DC line connections check for potential short circuits"
  assertCurrentHigherThanFail:
    errorCode: assertCurrentHigherThanFail
    errorName: "100217"
    classification: Maintenance
    severity: Major
    description: Current value at the output not high enough in the expected time.
    potentialRootCause: ""
    potentialResolution: "Investigate the exact moment when this error occurs and if error is alone or triggered after other error. It can be caused by: Setpoint was not received by Power Converter CAN communication problem or any other existing Power Converter issue which was not correctly detected Something is preventing the Power Converter from reaching the setpoint check if error is associated with specific EV (may point towards EV related problems) check if error is persistent or an isolated event. Isolated events should be registered but can be ignored. check if charger is able to reach a setpoint without an EV connected check all DC line connections check for potential short circuits"
  batteryOverVoltage:
    errorCode: batteryOverVoltage
    errorName: "110001"
    classification: Safety
    severity: Major
    description: Error triggered when dc voltage is higher than EV reported maximum voltage (tolerance of 10V considered). This error is implemented according IEC61851.
    potentialRootCause: ""
    potentialResolution: "Possible causes: together with dspLoadDump: root cause of load dump must be investigated caused by not reading correctly the EV max voltage: check PLC traces in order to confirm caused by EV battery voltage misbehaving: report to customer for joint analysis with EV OEM"
  highInitVoltage:
    errorCode: highInitVoltage
    errorName: "110002"
    classification: Safety
    severity: Major
    description: Voltage at the plug is higher than 60V at initialization
    potentialRootCause: ""
    potentialResolution: "Possible causes: EV is not disconnecting the batteries from the socket, voltage is already present even before charging process starts Output contactors are stuck and voltage is immediately at the plug  Output measurement after the contactors is not correct, either due to cabling issues or not calibrated"
  dispenserContactorTimeout:
    errorCode: dispenserContactorTimeout
    errorName: "110101"
    classification: Maintenance
    severity: Major
    description: Feedback for contactor open/closed was not received when command was issued.
    potentialRootCause: ""
    potentialResolution: "Check that the CAN communication is working Check that the contactor is working properly (power and feedback circuits) Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  dispenserDoorOpened:
    errorCode: dispenserDoorOpened
    errorName: "110102"
    classification: Safety
    severity: Major
    description: Dispenser door is open.
    potentialRootCause: ""
    potentialResolution: "Check if door is properly closed. Check if the door switch is working properly. Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  globalEmergency:
    errorCode: globalEmergency
    errorName: "110103"
    classification: Maintenance
    severity: Major
    description: Emergency button which is connected to both chargers and dispensers is pressed.
    potentialRootCause: ""
    potentialResolution: "Check that nothing is triggering the DC shutdown line Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  spdAC:
    errorCode: spdAC
    errorName: "110104"
    classification: Maintenance
    severity: Major
    description: AC surge arrester is active.
    potentialRootCause: ""
    potentialResolution: "Check if surge arrester was trigger, if yes, replace it Check connection between surge arrester and Linux and that the voltage levels of the feedback are correct Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  spdDC:
    errorCode: spdDC
    errorName: "110105"
    classification: Maintenance
    severity: Major
    description: DC surge arrester is active.
    potentialRootCause: ""
    potentialResolution: "Check if surge arrester was trigger, if yes, replace it Check connection between surge arrester and Linux and that the voltage levels of the feedback are correct Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  depotDoorOpenedCb:
    errorCode: depotDoorOpenedCb
    errorName: "110106"
    classification: Safety
    severity: Major
    description: Door Opened on DepotPanto ControlBox.
    potentialRootCause: ""
    potentialResolution: "Check if door is properly closed. Check if the door switch is working properly. Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  depotDoorOpenedPb:
    errorCode: depotDoorOpenedPb
    errorName: "110107"
    classification: Safety
    severity: Major
    description: Door Opened on DepotPanto PowerBox.
    potentialRootCause: ""
    potentialResolution: "Check if door is properly closed. Check if the door switch is working properly. Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  mainProcessError:
    errorCode: mainProcessError
    errorName: "110201"
    classification: Maintenance
    severity: Major
    description: Error on the mainProcess fiber, probably an unexpected sequence of AKKA stages.
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  cpStateFault:
    errorCode: cpStateFault
    errorName: "110202"
    classification: Safety
    severity: Critical
    description: Unexpected transition of CP state from C/D to A.
    potentialRootCause: ""
    potentialResolution: "Should be reported to customer for joint analysis with EV OEM. If proven that the issue is not on EV side: Check all CP connections Check that CP measurement matches actual multimeter values Check all PE connections to guarantee that noise is not causing wrong CP measurements measure CP noise using an oscilloscope"
  noCommunicationToAkka:
    errorCode: noCommunicationToAkka
    errorName: "110203"
    classification: Maintenance
    severity: Major
    description: When siucapp boots, it waits for messages from AKKA. If no message is received, this error will appear.
    potentialRootCause: ""
    potentialResolution: Via candump, check that no CAN messages are being exchanged between AKKA and Linux Check that AKKA is working properly Check the CAN connection to the AKKA and Linux, in particular if the shielding in not touching any other cable or if the cable was not damaged in production causing a faulty connection. with everything OFF, measure the resistance between CAN H/L which should be ~60ohm. If not, check that all CAN configuration switches are according the schematic.
  communicationLostAkka:
    errorCode: communicationLostAkka
    errorName: "110204"
    classification: Maintenance
    severity: Major
    description: siucapp is not receiving messages from AKKA within the minimum interval defined.
    potentialRootCause: ""
    potentialResolution: Via candump, check that no CAN messages are being exchanged between AKKA and Linux Check that AKKA is working properly Check the CAN connection to the AKKA and Linux, in particular if the shielding in not touching any other cable or if the cable was not damaged in production causing a faulty connection. with everything OFF, measure the resistance between CAN H/L which should be ~60ohm. If not, check that all CAN configuration switches are according the schematic.
  slacFailure:
    errorCode: slacFailure
    errorName: "110205"
    classification: Maintenance
    severity: Minor
    description: Session could not establish a TCP connection, failed at SLAC.
    potentialRootCause: ""
    potentialResolution: "Should be reported to customer for joint analysis with EV OEM. If proven that the issue is not on EV side: Check all CP connections Check that CP measurement matches actual multimeter values Check all PE connections to guarantee that noise is not causing wrong CP measurements measure CP noise using an oscilloscope"
  sessionSetupFailure:
    errorCode: sessionSetupFailure
    errorName: "110206"
    classification: Maintenance
    severity: Minor
    description: After TCP connection was established, session was not able to reach CableCheck.
    potentialRootCause: ""
    potentialResolution: "Should be reported to customer for joint analysis with EV OEM. Main cause must be related with ISO15118 protocol issues (example: failed to negotiated session limits during ChargeParameterDiscovery)"
  sendMessageError:
    errorCode: sendMessageError
    errorName: "120213"
    classification: Maintenance
    severity: Major
    description: An error occurred while trying to send a message.
    potentialRootCause: ""
    potentialResolution: siucapp specific error. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  evseShutdownTimeout:
    errorCode: evseShutdownTimeout
    errorName: "110208"
    classification: Maintenance
    severity: Minor
    description: Timeout for the vehicle to do a normal shutdown.
    potentialRootCause: ""
    potentialResolution: Should be reported to customer for joint analysis with EV OEM. It means that something is not working well in the shutdown process of the vehicle which forces us to create a timeout in order to close the session and be ready for a new one.
  dcPlusTemperature:
    errorCode: dcPlusTemperature
    errorName: "110209"
    classification: Safety
    severity: Major
    description: Temperature of the plug out of range (DC+).
    potentialRootCause: ""
    potentialResolution: Check if the plug sensor is working properly by measuring it's resistance and comparing with any other temperature measurement device. Check if the signal is correctly reaching the output platform (Gen2) or the S7 (Gen1 Dispenser) and if input matches the schematics. Check if there are any physical damages on the plug which may have caused a malfunction on the sensors.
  dcMinusTemperature:
    errorCode: dcMinusTemperature
    errorName: "110210"
    classification: Safety
    severity: Major
    description: Temperature of the plug out of range (DC-).
    potentialRootCause: ""
    potentialResolution: Check if the plug sensor is working properly by measuring it's resistance and comparing with any other temperature measurement device. Check if the signal is correctly reaching the output platform (Gen2) or the S7 (Gen1 Dispenser) and if input matches the schematics. Check if there are any physical damages on the plug which may have caused a malfunction on the sensors.
  ressTemperatureInhibit:
    errorCode: ressTemperatureInhibit
    errorName: "110220"
    classification: Maintenance
    severity: Minor
    description: Definition from Table 100 of ISO15118-2 Battery Temperature Inhibit, Battery too hot/cold to accept charge.
    potentialRootCause: ""
    potentialResolution: EV generated error and sent according ISO15118. Should be reported to customer for joint analysis with EV OEM.
  evShiftPosition:
    errorCode: evShiftPosition
    errorName: "110221"
    classification: Maintenance
    severity: Minor
    description: Definition from Table 100 of ISO15118-2 Vehicle Shift Position, Vehicle is not in Park.
    potentialRootCause: ""
    potentialResolution: EV generated error and sent according ISO15118. Should be reported to customer for joint analysis with EV OEM.
  chargerConnectorLockFault:
    errorCode: chargerConnectorLockFault
    errorName: "110222"
    classification: Maintenance
    severity: Minor
    description: Definition from Table 100 of ISO15118-2 Charger Connector Lock Fault, Vehicle has not detected the Charge cord connector locked into the inlet or failure where connector cannot be unlocked from the charging inlet.
    potentialRootCause: ""
    potentialResolution: EV generated error and sent according ISO15118. Should be reported to customer for joint analysis with EV OEM.
  evRessMalfunction:
    errorCode: evRessMalfunction
    errorName: "110223"
    classification: Maintenance
    severity: Minor
    description: Definition from Table 100 of ISO15118-2 Vehicle RESS Malfunction, Any non-recoverable fault or error condition of the Vehicle RESS. (RESS= Battery)
    potentialRootCause: ""
    potentialResolution: EV generated error and sent according ISO15118. Should be reported to customer for joint analysis with EV OEM.
  chargingCurrentDiff:
    errorCode: chargingCurrentDiff
    errorName: "110224"
    classification: Maintenance
    severity: Minor
    description: Definition from Table 100 of ISO15118-2 Charging Current Differential, Indication that vehicle has stopped the charging session after detecting that the charging station is not able to maintain the current request.
    potentialRootCause: ""
    potentialResolution: EV generated error and sent according ISO15118. Should be reported to customer for joint analysis with EV OEM.
  chargingVoltageOutOfRange:
    errorCode: chargingVoltageOutOfRange
    errorName: "110225"
    classification: Maintenance
    severity: Minor
    description: Definition from Table 100 of ISO15118-2 Charging voltage out of range, Indication that vehicle has stopped the charging session after detecting that the RESS is either under or above normal operating voltage range.
    potentialRootCause: ""
    potentialResolution: EV generated error and sent according ISO15118. Should be reported to customer for joint analysis with EV OEM.
  chargingSystemIncompatibility:
    errorCode: chargingSystemIncompatibility
    errorName: "110226"
    classification: Maintenance
    severity: Minor
    description: "Definition from Table 100 of ISO15118-2 Charging System Incompatibility, if the vehicle determines that the charging station is incompatible. Using this value is optional; as an alternative, the vehicle can use EVReady in DC_EVStatusType equal to “FALSE”."
    potentialRootCause: ""
    potentialResolution: EV generated error and sent according ISO15118. Should be reported to customer for joint analysis with EV OEM.
  pantographError:
    errorCode: pantographError
    errorName: "110301"
    classification: Maintenance
    severity: Minor
    description: Both feedbacks (that the pantograph is in the up and down position) are being received at the same time.
    potentialRootCause: ""
    potentialResolution: "Check that the pantograph is working properly Check if the signal is correctly reaching the Linux controller and if output matches the schematics. Check that there are 24V in the output when the command is issued Check if Linux is detecting properly the signal: feedback must be visible in the logs output must be correctly configured in gpio.conf"
  pantographButtonPressed:
    errorCode: pantographButtonPressed
    errorName: "110302"
    classification: Maintenance
    severity: Major
    description: Stop/Emergency button on the pantograph is pressed.
    potentialRootCause: ""
    potentialResolution: "Check that button is not pressed and working properly Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs output must be correctly configured in gpio.conf"
  pantographDidNotMove:
    errorCode: pantographDidNotMove
    errorName: "110303"
    classification: Maintenance
    severity: Major
    description: Pantograph did not move.
    potentialRootCause: ""
    potentialResolution: "Check that the pantograph is working properly Check if the signal is correctly reaching the Linux controller and if output matches the schematics. Check that there are 24V in the output when the command is issued Check if Linux is detecting properly the signal: feedback must be visible in the logs output must be correctly configured in gpio.conf"
  pantographTimeout:
    errorCode: pantographTimeout
    errorName: "110304"
    classification: Maintenance
    severity: Major
    description: Pantograph did not reach the end position in time. It is generated as a protection in case the pantograph is stuck while moving or one of the position sensors (up or down) is not working as it should.
    potentialRootCause: ""
    potentialResolution: "Check that the pantograph is working properly Check if the signal is correctly reaching the Linux controller and if output matches the schematics. Check that there are 24V in the output when the command is issued Check if Linux is detecting properly the signal: feedback must be visible in the logs output must be correctly configured in gpio.conf"
  cpStateLost:
    errorCode: cpStateLost
    errorName: "110305"
    classification: Safety
    severity: Critical
    description: Unexpected transition of CP state from C/D to A.
    potentialRootCause: ""
    potentialResolution: "Should be reported to customer for joint analysis with EV OEM. If proven that the issue is not on EV side: Check all CP connections Check that CP measurement matches actual multimeter values Check all PE connections to guarantee that noise is not causing wrong CP measurements measure CP noise using an oscilloscope"
  pantoDownToCpBTimeout:
    errorCode: pantoDownToCpBTimeout
    errorName: "110306"
    classification: Maintenance
    severity: Major
    description: Timeout between pantograph being down and CP B
    potentialRootCause: ""
    potentialResolution: Position of the vehicle is not correct; contacts are not aligned between pantograph and vehicle rails Dirt or damaged pantograph or rails CP is not being correctly generated by the ACD CP is not being correctly measured by ACD
  cpBToCTimeout:
    errorCode: cpBToCTimeout
    errorName: "110307"
    classification: Maintenance
    severity: Major
    description: Transition from CP State B to C timeout.
    potentialRootCause: ""
    potentialResolution: "Should be reported to customer for joint analysis with EV OEM. If proven that the issue is not on EV side: Check all CP connections Check that CP measurement matches actual multimeter values Check all PE connections to guarantee that noise is not causing wrong CP measurements measure CP noise using an oscilloscope"
  sequenceError:
    errorCode: sequenceError
    errorName: "110308"
    classification: Maintenance
    severity: Major
    description: Message received via WiFi is not in the sequence establish in ISO15118/OppCharge.
    potentialRootCause: ""
    potentialResolution: Should be reported to customer for joint analysis with EV OEM.
  messageTimeout:
    errorCode: messageTimeout
    errorName: "110309"
    classification: Maintenance
    severity: Major
    description: Message was not received via WiFi within the timeframe defined in ISO15118/OppCharge.
    potentialRootCause: ""
    potentialResolution: Should be reported to customer for joint analysis with EV OEM.
  invalidDataReceived:
    errorCode: invalidDataReceived
    errorName: "110310"
    classification: Maintenance
    severity: Major
    description: Message received via WiFi has a content which is not foreseen in ISO15118/OppCharge.
    potentialRootCause: ""
    potentialResolution: Should be reported to customer for joint analysis with EV OEM.
  unknownSession:
    errorCode: unknownSession
    errorName: "110311"
    classification: Maintenance
    severity: Minor
    description: Unknown session received from vehicle. Defined in ISO15118/OppCharge.
    potentialRootCause: ""
    potentialResolution: Should be reported to customer for joint analysis with EV OEM.
  invalidStage:
    errorCode: invalidStage
    errorName: "110312"
    classification: Maintenance
    severity: Major
    description: Invalid EVSECore stage while parsing a request.
    potentialRootCause: ""
    potentialResolution: Should be reported to customer for joint analysis with EV OEM.
  positionSensorError:
    errorCode: positionSensorError
    errorName: "110313"
    classification: Maintenance
    severity: Minor
    description: Loss of position sensor signal during charging procedure.
    potentialRootCause: ""
    potentialResolution: "Check that the sensor is working properly Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs output must be correctly configured in gpio.conf"
  noCommunicationToACD:
    errorCode: noCommunicationToACD
    errorName: "110314"
    classification: Maintenance
    severity: Major
    description: When siucapp boots, it waits for messages from ACD application. If no message is received, this error will appear.
    potentialRootCause: ""
    potentialResolution: Check that acdmqtt application is running and there are no errors in the logs Check that gpiomqtt application is running and there are no errors in the logs Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  communicationLostACD:
    errorCode: communicationLostACD
    errorName: "110315"
    classification: Maintenance
    severity: Major
    description: siucapp is not receiving messages from ACD application within the minimum interval defined.
    potentialRootCause: ""
    potentialResolution: Check that acdmqtt application is running and there are no errors in the logs Check that gpiomqtt application is running and there are no errors in the logs Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  cpCToBTimeout:
    errorCode: cpCToBTimeout
    errorName: "110316"
    classification: Maintenance
    severity: Minor
    description: Transition from CP State C to B timeout
    potentialRootCause: ""
