  emOVPhaseCS/PhaseCOverVoltage:
    errorCode: emOVPhaseCS/PhaseCOverVoltage
    errorName: "220506"
    classification: Maintenance
    severity: Major
    description: Over voltage on phase C. More than 460 V was detected on phase C.
    potentialRootCause: ""
    potentialResolution: All of the alarms thrown by the energy meter mean a failure on the Mains or a bad wiring (URevWnST/VoltagePhaseSequence). If there is no condition to trigger a given alarm, the board might be in defect and needs to be replaced. Always confirm this via an energy meter/oscilloscope. It is normal for some errors to appear when the charger is fully turned on, since the energy meter saves the alarms after detecting a power loss. The Linux Platform will turn off these alarms after boot up.
