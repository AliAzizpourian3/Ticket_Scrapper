  dspIGBTPlus0OverTemp:
    errorCode: dspIGBTPlus0OverTemp
    errorName: "220113"
    classification: Safety
    severity: Major
    description: "IGBT temperature is above 150ºC"
    potentialRootCause: ""
    potentialResolution: Check the siucapp logs and confirm that these temperatures are being measured. Check that there are no blocks to the ventilation, that the filters are properly maintained and clean and that the environmental conditions to which the charger is exposed are according the product manual.
  dspIGBTPlus1OverTemp:
