    description: System cannot close relay Input Filter. Feedback of contactor doesn't indicate that the relay Input Filter was closed (occurs after 1 s if no change on feedback). Relay is closed and then opens.
    potentialRootCause: ""
    potentialResolution: Feedback return that the relay is open or a command to stop the SoftStarter is issued.
  ssFilterCannotCloseRelay:
    errorCode: ssFilterCannotCloseRelay
    errorName: "220208"
    classification: Maintenance
    severity: Major
    description: System cannot open relay Input Filter. Feedback of contactor doesn't indicate that the relay Input Filter was opened (occurs after 1 s if no change on feedback). Relay is opened and then closes.
    potentialRootCause: ""
    potentialResolution: Feedback return that the relay is closed or a command to stop the SoftStarter is issued.
