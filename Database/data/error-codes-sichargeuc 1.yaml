    severity: Major
    description: "Dispenser temperature out of range (-20ºC to 55ºC)"
    potentialRootCause: ""
    potentialResolution: Check if the temperature sensor is working properly by measuring it's resistance and comparing with any other temperature measurement device Check if the signal is correctly reaching the S7 and if input matches the schematics. Check that the environmental conditions to which the charger is exposed are according the product manual.
  dispenserCANCommunicationLostLC:
    errorCode: dispenserCANCommunicationLostLC
    errorName: "210109"
    classification: Maintenance
    severity: Major
    description: Dispenser lost CAN communication with Liquid Cooled plug.
    potentialRootCause: ""
    potentialResolution: Via candump, check that no CAN messages are being exchanged between LC and S7 Check that LC is working properly Check the CAN connection to the LC and S7, in particular if the shielding in not touching any other cable or if the cable was not damaged in production causing a faulty connection. with everything OFF, measure the resistance between CAN H/L which should be ~60ohm. If not, check that all CAN configuration switches are according the schematic.
  dspDCOvervoltage:
    errorCode: dspDCOvervoltage
    errorName: "220101"
    classification: Safety
    severity: Major
    description: DC Capacitors Overvoltage
    potentialRootCause: ""
    potentialResolution: This might point towards a defective diode bridge. If it happens, other errors that appear need to be analyzed
  dspDCUndervoltage:
    errorCode: dspDCUndervoltage
    errorName: "220102"
    classification: Maintenance
    severity: Major
    description: DC Capacitors Undervoltage
    potentialRootCause: ""
    potentialResolution: This might point towards a defective diode bridge. If it happens, other errors that appear need to be analyzed
  dspDCUnbalancedCapacitors:
    errorCode: dspDCUnbalancedCapacitors
    errorName: "220103"
    classification: Safety
    severity: Major
    description: DC Capacitors Unbalanced
    potentialRootCause: ""
    potentialResolution: "This error can have several causes. Cause: Vehicle To understand this, it is important to understand how the transfer on energy from the charger to the vehicle happens. There is a voltage, vOut, and a current, i+, that is delivered to the vehicle. If everything works properly, i+ = i-. If not then i+ is not equal to i-. Since vOut is fixed by the vehicle and i+ by the charger, and since the charger is symmetrical, then the only variable that is able to change is the DC Link. As the DC Link becomes unsymmetrical to accommodate the difference between i+ and i-, there is a point in which the DCUnbalancedCapacitors is thrown. Global Wiki English > Errors and Associated Troubleshoot (Gen2 Software Guide) > image-2023-5-19_10-22-37.png  Cause: IGBTs Suppose that the IGBTs connected to the DC- are defected so that a switching delay happens or they are not able to let through the full current i-. This will create i+ not equal to i- and thus the same situation as above. Global Wiki English > Errors and Associated Troubleshoot (Gen2 Software Guide) > image-2023-5-19_10-24-0.png Cause: Diode Bridges Same as the IGBTs, a defective Diode Bridge will give an Unbalanced DC Link. Usually this is already seen after the Softstarter is on MONITORING state. There are some actions that can be taken to better understand the issue: Test with another vehicle to see if it is a vehicle problem or a charger problem and measuring the i+ and i- values to see the differences between vehicles. If not, then either the IGBTs or Diode Bridges need replacement. Usually both need, but it is more likely that there is an issue on the Diode Bridges. If there is a past IGBTxSaturation, this might mean that the IGBTs are broken. Always replace both drivers and IGBTs."
  dspOverCurrent:
    errorCode: dspOverCurrent
    errorName: "220104"
    classification: Safety
    severity: Major
    description: Over current detected on iBuck or iOut
    potentialRootCause: ""
    potentialResolution: "Investigation of the siucapp logs in order to understand root cause. In most cases it is caused by EV battery issues and it may be followed by other errors like EVRESSMalfunction. In case the source appears to be internal to the charger, guarantee that the charger is correctly calibrated and that are no other errors in the alarm history that can point towards an IGBT or DC capacitor issue. Other errors on the DSP may cause this error: since the DSP halts de IGBTs on error, the energy stored on the Output Capacitors may flow so fast to the vehicle that it may cause a spike in the current for a short period of time."
  dspOutputOvervoltage:
    errorCode: dspOutputOvervoltage
    errorName: "220105"
    classification: Safety
    severity: Major
    description: Over votlage detected on vOut or vBuck
    potentialRootCause: ""
    potentialResolution: Investigation of the siucapp logs in order to understand root cause. In most cases it is caused by EV battery issues and it may be followed by other errors like EVRESSMalfunction. In case the source appears to be internal to the charger, guarantee that the charger is correctly calibrated and that are no other errors in the alarm history that can point towards an IGBT or DC capacitor issue.
  dspLoadDump:
    errorCode: dspLoadDump
    errorName: "220106"
    classification: Maintenance
    severity: Major
    description: DC load, most likely the EV battery, was disconnected while energy was being transferred without any warning
    potentialRootCause: ""
    potentialResolution: This error is usually caused by the EV. It case you are sure that it is not an EV fault, check all DC lines to guarantee that no contact is loose or no devices like fuses or relays are not malfunctioning and causing a disconnection during charging.
  dspLowInputVoltage:
    errorCode: dspLowInputVoltage
    errorName: "220107"
