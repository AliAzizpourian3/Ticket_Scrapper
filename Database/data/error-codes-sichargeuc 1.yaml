  dspNeedRestart:
    errorCode: dspNeedRestart
    errorName: "220117"
    classification: Maintenance
    severity: Major
    description: A task running on the Master Core stopped working
    potentialRootCause: ""
    potentialResolution: Contact R&D and provide the logs. The system entered a safe state as an error on the board/firmware on the code was found.
  dspDCShutdown:
    errorCode: dspDCShutdown
    errorName: "220118"
    classification: Maintenance
    severity: Major
    description: DC Shutdown line is interrupted
    potentialRootCause: ""
    potentialResolution: "Confirm that 0 V are at the DC Shutdown Pin of the board. If 24 V appear, then the boards is damaged and needs replacement. If not, check the DC Shutdown path for any miswiring or broken cable: remember to check if the emergency button is released or the system is not in a known error that is opening the DC Shutdown line."
  dspSlaveNotCommunicating:
    errorCode: dspSlaveNotCommunicating
    errorName: "220120"
    classification: Maintenance
    severity: Major
    description: The Slave Core stopped sending data to the Master Core
    potentialRootCause: ""
    potentialResolution: Contact R&D and provide the logs. The system entered a safe state as an error on the board/firmware on the code was found.
  dspOutputShortCircuit:
    errorCode: dspOutputShortCircuit
    errorName: "220121"
    classification: Safety
    severity: Major
    description: vBuck or vOut keeps at 0 V although a voltage setpoint different than 0 is requested
    potentialRootCause: ""
    potentialResolution: Check all DC cables to guarantee that there is no short circuit. Check that the source was not the EV.
  dspOutputVoltageHigh:
    errorCode: dspOutputVoltageHigh
    errorName: "220122"
    classification: Safety
    severity: Major
    description: vBuck or vOut are above 20 V while the system is ONALARM or going from CONVERTING to READY. Error should be cleared after output voltage is below 20 V
    potentialRootCause: ""
    potentialResolution: Investigation of the siucapp logs in order to understand root cause. In most cases it is caused by EV battery issues and it may be followed by other errors like EVRESSMalfunction. In case the source appears to be internal to the charger, guarantee that the charger is correctly calibrated and that are no other errors in the alarm history that can point towards an IGBT or DC capacitor issue.
  dspCurrentMeasurementDiff:
    errorCode: dspCurrentMeasurementDiff
    errorName: "220123"
    classification: Maintenance
    severity: Major
    description: iBuck and iOut currents have a difference on the measurement of at least 25 A
    potentialRootCause: ""
    potentialResolution: Check the cables from the board to the Current Sensing Modules. If the error keeps persisting, even with a different vehicle, the DSP needs to be calibrated. Please pay attention to other errors, as this might happen in case the system is quickly halted e.g. DC Shutdown line triggered. There is a very small chance the the Current Sensing Modules are also broken, as this error checks if both sensing modules are providing the same measuring value.
  ssL1CannotOpenRelay:
