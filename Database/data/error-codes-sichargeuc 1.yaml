  ssDSTTrip:
    errorCode: ssDSTTrip
    errorName: "220211"
    classification: Maintenance
    severity: Major
    description: Surge arrester is blown.
    potentialRootCause: ""
    potentialResolution: Replace Surge arrester.
  opDCShutdown:
    errorCode: opDCShutdown
    errorName: 220301/220601/220701/220801
    classification: Maintenance
    severity: Major
    description: Emergency pushbutton press was detected.
    potentialRootCause: ""
    potentialResolution: "Confirm that 0 V are at the DC Shutdown Pin of the board. If 24 V appear, then the boards is damaged and needs replacement. If not, check the DC Shutdown path for any miswiring or broken cable: remember to check if the emergency button is released or the system is not in a known error that is opening the DC Shutdown line."
  opCannotCloseRelayPlus:
    errorCode: opCannotCloseRelayPlus
    errorName: 220302/220602/220702/220802
    classification: Maintenance
    severity: Major
    description: Feedback of contactor doesn't indicate that the relay Plus was closed (occurs after 1s if no change on feedback). Relay is closed and then opens.
    potentialRootCause: ""
    potentialResolution: "There can be 3 reasons why this errors can appear: The contactor related to the alarm is broken. The board is broken. The DC shutdown line is opened thus preventing the contactors to close or forcing then to open. In this case cannotCloseRelayPlus and cannotCloseRelayMinus are issued. If this happens, the errors can be ignored. To clear them, check the table above.  To confirm what is the cause follow the steps below: If the error is only on one of the contactors, switch the connections on the board between the Relay Plus and Minus. For instance, assume that the error is cannotOpenRelayPlus. Switch the connections from the relays to the board. If the error is now cannotOpenRelayMinus, then the relay is broken. Otherwise the error cannotOpenRelayPlus should keep appearing. Thus, the board is broken and needs replacement."
  opCannotOpenRelayPlus:
    errorCode: opCannotOpenRelayPlus
    errorName: 220303/220603/220703/220803
    classification: Safety
    severity: Major
    description: Feedback of contactor doesn't indicate that the relay Plus was opened (occurs after 1s if no change on feedback). System still tries to open the Relay.
    potentialRootCause: ""
    potentialResolution: "There can be 3 reasons why this errors can appear: The contactor related to the alarm is broken. The board is broken. The DC shutdown line is opened thus preventing the contactors to close or forcing then to open. In this case cannotCloseRelayPlus and cannotCloseRelayMinus are issued. If this happens, the errors can be ignored. To clear them, check the table above.  To confirm what is the cause follow the steps below: If the error is only on one of the contactors, switch the connections on the board between the Relay Plus and Minus. For instance, assume that the error is cannotOpenRelayPlus. Switch the connections from the relays to the board. If the error is now cannotOpenRelayMinus, then the relay is broken. Otherwise the error cannotOpenRelayPlus should keep appearing. Thus, the board is broken and needs replacement."
