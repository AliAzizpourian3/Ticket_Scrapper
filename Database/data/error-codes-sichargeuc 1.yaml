  ocppUnavailable:
    errorCode: ocppUnavailable
    errorName: "130103"
    classification: Maintenance
    severity: Major
    description: Set whenever the AvailabilityState of an EVSE is set to Inoperative by the CSMS
    potentialRootCause: ""
    potentialResolution: This is only considered an error if the AvailabilityState is set to Operative by the CSMS and the error doesn't clear. Please keep in mind that the AvailabilityState is persistent so, once received, rebooting will not clear the error. It must be reset by the CSMS. In extreme cases (not recommended during a regular operation) the OCPP cache can be cleared by removing the content of the /opt/sicharge/apps/ocpp-ng/var folder, except the ssl folder.
  externalButton1Pressed:
    errorCode: externalButton1Pressed
    errorName: "130201"
    classification: Maintenance
    severity: Major
    description: First external button pressed.
    potentialRootCause: ""
    potentialResolution: "Check that button is not pressed and working properly Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  externalButton2Pressed:
    errorCode: externalButton2Pressed
    errorName: "130202"
    classification: Maintenance
    severity: Major
    description: Second external button pressed.
    potentialRootCause: ""
    potentialResolution: "Check that button is not pressed and working properly Check if the signal is correctly reaching the Linux controller and if input matches the schematics. Check if Linux is detecting properly the signal: feedback must be visible in the logs input must be correctly configured in gpio.conf"
  dispenserCANCommunicationLostAkka:
    errorCode: dispenserCANCommunicationLostAkka
    errorName: "210101"
    classification: Maintenance
    severity: Major
    description: Dispenser lost CAN communication with AKKA.
    potentialRootCause: ""
    potentialResolution: "Via candump, check that no CAN messages are being exchanged between device and S7. Check that device is working properly Check the CAN connection to the device and S7, in particular if the shielding in not touching any other cable or if the cable was not damaged in production causing a faulty connection. With everything OFF, measure the resistance between CAN H/L which should be ~60ohm. If not, check that all CAN configuration switches are according the schematic. Confirm that the PLC debug mode is not ON (example: USB Pen is not being used for PLC traces)"
  dispenserDoor:
    errorCode: dispenserDoor
    errorName: "210102"
    classification: Safety
    severity: Major
    description: Dispenser door is open.
    potentialRootCause: ""
    potentialResolution: Check if door is properly closed. Check if the door switch is working properly. Check if the signal is correctly reaching the S7 controller and if input matches the schematics. Check if S7 is detecting properly the signal using TIA Portal.
  dispenserFusePlus:
    errorCode: dispenserFusePlus
