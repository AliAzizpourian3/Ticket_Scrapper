    potentialResolution: Only possible in chargers with direct feedback from the "master" configuration key. Same as wrongMasterConfiguration, check that the charger which has the "master" key is also the same that is configured as master in the software. "Master" charger has different configuration files than the other chargers. For more details please check the software manual. Check if the key feedback is correctly wired to the respective Linux.
  distributedBindFail:
    errorCode: distributedBindFail
    errorName: "120410"
    classification: Maintenance
    severity: Major
    description: The combiner (dispenser/panto/master charger) could not bind to any of the peers.
    potentialRootCause: ""
    potentialResolution: Dispenser/Panto/Master is able to connect to the multiple chargers but is not able to request them to turn ON in order to start the charging session.  Investigate the siucapp_peer logs for each charger in order to understand root cause. Chargers may enter in error when turning ON If no error can be seen at the peers, investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  outputStateClose:
    errorCode: outputStateClose
    errorName: "120412"
    classification: Maintenance
    severity: Major
    description: One of the peers (chargers) could not open it's output. Not safe to charge in parallel.
    potentialRootCause: ""
    potentialResolution: "Using the siucapp logs, identify to which charger this error relates to. In that specific charger: There can be 3 reasons why this errors can appear: The contactor related to the alarm is broken. The board is broken. The DC shutdown line is opened thus preventing the contactors to close or forcing then to open. In this case cannotCloseRelayPlus and cannotCloseRelayMinus are issued. If this happens, the errors can be ignored. To clear them, check the table above.  To confirm what is the cause follow the steps below: If the error is only on one of the contactors, switch the connections on the board between the Relay Plus and Minus. For instance, assume that the error is cannotOpenRelayPlus. Switch the connections from the relays to the board. If the error is now cannotOpenRelayMinus, then the relay is broken. Otherwise the error cannotOpenRelayPlus should keep appearing. Thus, the board is broken and needs replacement."
  lostAllPeers:
    errorCode: lostAllPeers
    errorName: "120413"
    classification: Maintenance
    severity: Major
    description: Indication all bound peers (chargers) were lost (due to errors or loss of communication) and session must be interrupted.  This error should only happen during charging.
    potentialRootCause: ""
    potentialResolution: Similar to distributedBindFail but already during the charging process. Investigate the siucapp_peer logs for each charger in order to understand root cause. Chargers may go to error when turning ON If no error can be seen at the peers, investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D.
  peersVoltageSetpointFail:
    errorCode: peersVoltageSetpointFail
    errorName: "120414"
    classification: Maintenance
    severity: Major
    description: Voltage setpoint was not successfully sent to at least one of the bound peers (chargers).
    potentialRootCause: ""
    potentialResolution: "Guarantee that there are no communication problems between Dispenser/Panto/Master and the remaining chargers. Can be related to ethernet/FO connection issues: Check that all chargers are correctly connected and powered up Check that all ethernet/FO cables are working and installed properly Check if all ethernet/FO switches are working Please keep in mind that the quality and type of the cable must be according what is specified in the product manual. No device, converter or similar should be connected between devices. Investigate the exact moment when this error occurs and if error is alone or triggered after other error. Provide all findings together with logs to the R&D."
