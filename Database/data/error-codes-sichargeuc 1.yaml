    errorName: "210107"
    classification: Maintenance
    severity: Major
    description: Dispenser lost communication with Modbus server.
    potentialRootCause: ""
    potentialResolution: Check the ethernet connection is correctly established between charger and dispenser Check that the ethernet cable is working properly Check that the ethernet cable is according the specification (both cable type and installation) Check that the S7 is working properly and with the latest software version Check that the Linux is working properly and with the latest software version modbusmqtt application must be running and without errors in the logs
  dispenserTemperature:
    errorCode: dispenserTemperature
    errorName: "210108"
