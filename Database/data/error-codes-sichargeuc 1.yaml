    potentialRootCause: ""
    potentialResolution: Check the CAN connection to the DSP, in particular if the shielding in not touching any other cable or if the cable was not damaged in production causing a faulty connection. With everything OFF, measure the resistance between CAN H/L which should be ~60ohm. If not, check that all CAN configuration switches are according the schematic.
  dspIGBTPlus0Saturation:
